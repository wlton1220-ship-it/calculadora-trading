<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Trading</title>
    <!-- Tailwind CSS para el diseño minimalista -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tipografía de Notion -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #191919; 
            color: #d4d4d4; 
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        /* Estilo de los inputs para que parezcan de Notion */
        input, select { 
            background-color: #202020; 
            border: 1px solid #333; 
            color: #fff; 
            transition: border-color 0.2s;
        }
        input:focus, select:focus { 
            outline: none; 
            border-color: #5a5a5a; 
        }
        /* Ocultar las flechas de los campos numéricos */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="p-4 w-full">

    <div class="max-w-md mx-auto w-full bg-[#191919] p-2">
        <h2 class="text-sm font-semibold mb-5 text-[#888] uppercase tracking-wider text-center">Gestión de Riesgo</h2>

        <!-- Ajustes de Cuenta -->
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-xs text-gray-500 mb-1">Balance (USD)</label>
                <input type="number" id="balance" class="w-full px-3 py-2 rounded text-sm" value="1000" placeholder="Tu capital">
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Riesgo (%)</label>
                <input type="number" id="risk" class="w-full px-3 py-2 rounded text-sm" value="1" step="0.1">
            </div>
        </div>

        <!-- Selección de Activo -->
        <div class="mb-4">
            <label class="block text-xs text-gray-500 mb-1">Activo</label>
            <select id="asset" class="w-full px-3 py-2 rounded text-sm cursor-pointer">
                <option value="nasdaq">NASDAQ 100 (Puntos)</option>
                <option value="gold">ORO / XAUUSD (Puntos / Dólares)</option>
            </select>
        </div>

        <!-- Precios del Trade -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div>
                <label class="block text-xs text-gray-500 mb-1">Entrada</label>
                <input type="number" id="entry" class="w-full px-2 py-2 rounded text-sm text-center" placeholder="Ej: 20050">
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Stop Loss</label>
                <input type="number" id="sl" class="w-full px-2 py-2 rounded text-sm text-center" placeholder="Ej: 20030">
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Take Profit</label>
                <input type="number" id="tp" class="w-full px-2 py-2 rounded text-sm text-center" placeholder="Ej: 20110">
            </div>
        </div>

        <!-- Panel de Resultados -->
        <div class="bg-[#202020] rounded-lg border border-[#333] p-4 shadow-sm">
            <div class="space-y-3 text-sm">
                
                <div class="flex justify-between items-center border-b border-[#333] pb-2">
                    <span class="text-gray-400">Pérdida Máxima:</span>
                    <span class="font-mono text-[#ff6b6b] font-medium" id="out-risk-usd">$0.00</span>
                </div>

                <div class="flex justify-between items-center border-b border-[#333] pb-2">
                    <span class="text-gray-400">Distancia de Stop:</span>
                    <span class="font-mono text-white" id="out-sl-dist">0 pts</span>
                </div>

                <div class="flex justify-between items-center border-b border-[#333] pb-2">
                    <span class="text-gray-400">Ratio Riesgo/Beneficio:</span>
                    <span class="font-mono text-white font-medium" id="out-rr">-</span>
                </div>

                <div class="flex justify-between items-center pt-1">
                    <span class="text-gray-300 font-medium">Tamaño de Posición:</span>
                    <span class="font-mono text-[#4dabf7] font-bold text-lg" id="out-lots">0.00 <span class="text-xs font-normal text-gray-500">Lotes</span></span>
                </div>

            </div>
        </div>
    </div>

    <script>
        function calculate() {
            // Obtener valores de los inputs
            const balance = parseFloat(document.getElementById('balance').value);
            const riskPct = parseFloat(document.getElementById('risk').value);
            const asset = document.getElementById('asset').value;
            const entry = parseFloat(document.getElementById('entry').value);
            const sl = parseFloat(document.getElementById('sl').value);
            const tp = parseFloat(document.getElementById('tp').value);

            if(isNaN(balance) || isNaN(riskPct)) return;

            // 1. Calcular Riesgo en Dólares
            const riskUsd = balance * (riskPct / 100);
            document.getElementById('out-risk-usd').innerText = '$' + riskUsd.toFixed(2);

            if(isNaN(entry) || isNaN(sl) || entry === sl) {
                document.getElementById('out-sl-dist').innerText = '0 pts';
                document.getElementById('out-rr').innerText = '-';
                document.getElementById('out-lots').innerHTML = '0.00 <span class="text-xs font-normal text-gray-500">Lotes</span>';
                return;
            }

            // 2. Calcular Distancia del Stop Loss en puntos absolutos
            const slDist = Math.abs(entry - sl);
            document.getElementById('out-sl-dist').innerText = slDist.toFixed(2) + ' pts';

            // 3. Calcular Ratio Riesgo/Beneficio
            if(!isNaN(tp) && tp !== entry) {
                const tpDist = Math.abs(tp - entry);
                const rr = tpDist / slDist;
                
                const rrEl = document.getElementById('out-rr');
                rrEl.innerText = '1 : ' + rr.toFixed(2);
                
                // Cambiar a color verde si el ratio es 1:2 o mejor
                if (rr >= 2) {
                    rrEl.classList.add('text-[#51cf66]');
                    rrEl.classList.remove('text-white');
                } else {
                    rrEl.classList.add('text-white');
                    rrEl.classList.remove('text-[#51cf66]');
                }
            } else {
                document.getElementById('out-rr').innerText = '-';
            }

            // 4. Calcular Lotaje (Tamaño de posición)
            let lots = 0;
            if(asset === 'nasdaq') {
                // Fórmula Nasdaq: 1 lote = 1$ por punto de movimiento
                lots = riskUsd / slDist;
            } else if (asset === 'gold') {
                // Fórmula Oro: 1 lote estándar = 100 onzas. 1 punto ($1) de movimiento = $100
                lots = riskUsd / (slDist * 100);
            }

            // Mostrar lotaje con 2 decimales
            document.getElementById('out-lots').innerHTML = `${lots.toFixed(2)} <span class="text-xs font-normal text-gray-500">Lotes</span>`;
        }

        // Escuchar cambios en todos los inputs para recalcular en tiempo real
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => input.addEventListener('input', calculate));
        
        // Ejecutar un cálculo inicial al cargar
        calculate();
    </script>
</body>
</html>
