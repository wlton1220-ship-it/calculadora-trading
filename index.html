<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Posición</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tipografía Inter (Estilo Notion) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #191919; /* Fondo oscuro de Notion */
            color: #e5e5e5; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .app-container {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 12px;
            width: 100%;
            max-w: 400px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .input-field {
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: #ffffff;
            border-radius: 6px;
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-field:focus {
            border-color: #666;
        }
        /* Bordes de color para SL y TP */
        .input-sl {
            border-left: 3px solid #ff4d4d;
        }
        .input-tp {
            border-left: 3px solid #4ade80;
        }
        .label-text {
            font-size: 13px;
            color: #a3a3a3;
            margin-bottom: 6px;
            display: block;
            font-weight: 500;
        }
        .results-box {
            background-color: #262626;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            margin-top: 24px;
        }
        /* Ocultar flechas numéricas */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h2 class="text-xl font-bold text-center text-white mb-6">Calculadora de Posición</h2>

        <!-- Desplegable de Activo -->
        <div class="mb-5">
            <label class="label-text">Activo a operar</label>
            <select id="asset" class="input-field cursor-pointer">
                <option value="nasdaq">NASDAQ 100</option>
                <option value="gold">ORO (XAUUSD)</option>
            </select>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-5">
            <div>
                <label class="label-text">Balance Cuenta ($)</label>
                <input type="number" id="balance" class="input-field" value="10000">
            </div>
            <div>
                <label class="label-text">Riesgo (%)</label>
                <input type="number" id="risk" class="input-field" value="1" step="0.1">
            </div>
        </div>

        <div class="mb-5">
            <label class="label-text">Precio de Entrada</label>
            <input type="number" id="entry" class="input-field" placeholder="Ej: 20250.50">
        </div>

        <div class="mb-5">
            <label class="label-text">Stop Loss (SL)</label>
            <input type="number" id="sl" class="input-field input-sl" placeholder="Ej: 20230.00">
        </div>

        <div class="mb-5">
            <label class="label-text">Take Profit (TP)</label>
            <input type="number" id="tp" class="input-field input-tp" placeholder="Ej: 20300.00">
        </div>

        <!-- Caja de Resultados -->
        <div class="results-box">
            <div class="text-center text-[#888] text-xs font-bold tracking-widest mb-4">RESULTADOS</div>
            
            <div class="flex justify-between items-center mb-3">
                <span class="text-[#a3a3a3] text-sm">Riesgo de Capital</span>
                <span class="font-semibold text-[#ff6b6b] text-base" id="out-risk">$ 0.00</span>
            </div>
            
            <div class="flex justify-between items-center mb-3">
                <span class="text-[#a3a3a3] text-sm">Tamaño Posición (Lotes)</span>
                <span class="font-bold text-white text-lg" id="out-lots">0</span>
            </div>
            
            <div class="flex justify-between items-center">
                <span class="text-[#a3a3a3] text-sm">Ratio Riesgo/Beneficio</span>
                <span class="font-semibold text-white text-base" id="out-rr">1 : 0.00</span>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const balance = parseFloat(document.getElementById('balance').value);
            const riskPct = parseFloat(document.getElementById('risk').value);
            const asset = document.getElementById('asset').value;
            const entry = parseFloat(document.getElementById('entry').value);
            const sl = parseFloat(document.getElementById('sl').value);
            const tp = parseFloat(document.getElementById('tp').value);

            if(isNaN(balance) || isNaN(riskPct)) return;

            // Calcular Riesgo en Dólares
            const riskUsd = balance * (riskPct / 100);
            document.getElementById('out-risk').innerText = '$ ' + riskUsd.toFixed(2);

            // Si faltan datos de entrada o el SL es igual a la entrada, resetear resultados
            if(isNaN(entry) || isNaN(sl) || entry === sl) {
                document.getElementById('out-lots').innerText = '0';
                document.getElementById('out-rr').innerText = '1 : 0.00';
                return;
            }

            // Distancia del Stop Loss
            const slDist = Math.abs(entry - sl);

            // Calcular Lotaje según activo
            let lots = 0;
            if(asset === 'nasdaq') {
                // Nasdaq: 1 lote = 1$ por punto
                lots = riskUsd / slDist;
            } else if (asset === 'gold') {
                // Oro: 1 lote = 100 onzas (100$ por cada punto de movimiento)
                lots = riskUsd / (slDist * 100);
            }
            
            document.getElementById('out-lots').innerText = lots.toFixed(2);

            // Calcular Ratio Riesgo/Beneficio
            if(!isNaN(tp) && tp !== entry) {
                const tpDist = Math.abs(tp - entry);
                const rr = tpDist / slDist;
                document.getElementById('out-rr').innerText = '1 : ' + rr.toFixed(2);
            } else {
                document.getElementById('out-rr').innerText = '1 : 0.00';
            }
        }

        // Eventos para actualizar en tiempo real al escribir
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => input.addEventListener('input', calculate));
        
        // Ejecución inicial
        calculate();
    </script>
</body>
</html>
