<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Trading</title>
    <!-- Cargamos Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tipografía Inter (Estilo Notion) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        notionBg: '#191919',
                        notionCard: '#202020',
                        notionBorder: '#2f2f2f',
                        notionText: '#d4d4d4',
                        notionInput: '#2a2a2a',
                        profit: '#2ea043',
                        loss: '#f85149'
                    }
                }
            }
        }
    </script>
    <style>
        /* Estilos base para scrollbar y selección */
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-notionBg text-notionText font-sans p-4 sm:p-6 flex justify-center items-start overflow-y-auto">

    <div class="w-full max-w-md bg-notionCard border border-notionBorder rounded-xl shadow-lg p-6">
        <h2 class="text-xl font-semibold mb-6 text-white text-center">Calculadora de Posición</h2>
        
        <form id="calcForm" class="space-y-4">
            <!-- Balance y Riesgo -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Balance Cuenta ($)</label>
                    <input type="number" id="balance" step="any" placeholder="10000" class="w-full bg-notionInput border border-notionBorder rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-gray-400 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Riesgo (%)</label>
                    <input type="number" id="riskPct" step="any" placeholder="1.0" value="1" class="w-full bg-notionInput border border-notionBorder rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-gray-400 transition-colors">
                </div>
            </div>

            <!-- Precios -->
            <div class="space-y-3 pt-2">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Precio de Entrada</label>
                    <input type="number" id="entry" step="any" class="w-full bg-notionInput border border-notionBorder rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-gray-400 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Stop Loss (SL)</label>
                    <input type="number" id="stopLoss" step="any" class="w-full bg-notionInput border border-notionBorder border-l-2 border-l-loss rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-gray-400 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Take Profit (TP)</label>
                    <input type="number" id="takeProfit" step="any" class="w-full bg-notionInput border border-notionBorder border-l-2 border-l-profit rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-gray-400 transition-colors">
                </div>
            </div>
        </form>

        <!-- Resultados -->
        <div class="mt-8 p-4 bg-notionInput rounded-xl border border-notionBorder">
            <h3 class="text-xs uppercase tracking-wider font-semibold text-gray-500 mb-3 text-center">Resultados</h3>
            
            <div class="space-y-3">
                <div class="flex justify-between items-center pb-2 border-b border-notionBorder">
                    <span class="text-sm text-gray-400">Riesgo de Capital</span>
                    <span id="resRiskMoney" class="font-semibold text-loss">$ 0.00</span>
                </div>
                
                <div class="flex justify-between items-center pb-2 border-b border-notionBorder">
                    <span class="text-sm text-gray-400">Tamaño Posición (U)</span>
                    <span id="resPositionSize" class="font-bold text-white text-lg">0</span>
                </div>
                
                <div class="flex justify-between items-center">
                    <span class="text-sm text-gray-400">Ratio Riesgo/Beneficio</span>
                    <span id="resRR" class="font-semibold text-gray-400">1 : 0.00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Obtener referencias a los inputs
        const inputs = document.querySelectorAll('input[type="number"]');
        const balanceInput = document.getElementById('balance');
        const riskPctInput = document.getElementById('riskPct');
        const entryInput = document.getElementById('entry');
        const stopLossInput = document.getElementById('stopLoss');
        const takeProfitInput = document.getElementById('takeProfit');

        // Obtener referencias a los resultados
        const resRiskMoney = document.getElementById('resRiskMoney');
        const resPositionSize = document.getElementById('resPositionSize');
        const resRR = document.getElementById('resRR');

        // Función principal de cálculo
        function calculate() {
            const balance = parseFloat(balanceInput.value) || 0;
            const riskPct = parseFloat(riskPctInput.value) || 0;
            const entry = parseFloat(entryInput.value) || 0;
            const stopLoss = parseFloat(stopLossInput.value) || 0;
            const takeProfit = parseFloat(takeProfitInput.value) || 0;

            // 1. Calcular riesgo en dinero
            const riskMoney = balance * (riskPct / 100);
            resRiskMoney.textContent = `$ ${riskMoney.toFixed(2)}`;

            // 2. Calcular tamaño de la posición
            let positionSize = 0;
            let riskPerUnit = 0;

            if (entry > 0 && stopLoss > 0 && entry !== stopLoss) {
                // Math.abs maneja automáticamente si es un trade en Largo (Long) o Corto (Short)
                riskPerUnit = Math.abs(entry - stopLoss);
                positionSize = riskMoney / riskPerUnit;
                
                // Formateamos para mostrar hasta 4 decimales si es necesario (útil para crypto)
                // Si es un número mayor a 10, mostramos menos decimales
                if(positionSize > 100) {
                    resPositionSize.textContent = positionSize.toFixed(2);
                } else {
                    resPositionSize.textContent = positionSize.toFixed(4).replace(/\.?0+$/, ''); // Elimina ceros extra
                }
            } else {
                resPositionSize.textContent = "0";
            }

            // 3. Calcular Ratio Riesgo/Beneficio (RR)
            if (entry > 0 && stopLoss > 0 && takeProfit > 0 && riskPerUnit > 0) {
                const rewardPerUnit = Math.abs(takeProfit - entry);
                const rr = rewardPerUnit / riskPerUnit;
                
                resRR.textContent = `1 : ${rr.toFixed(2)}`;
                
                // Colorear el RR basado en si es bueno (>1) o malo (<1)
                if (rr >= 1) {
                    resRR.className = "font-semibold text-profit";
                } else if (rr > 0) {
                    resRR.className = "font-semibold text-loss";
                } else {
                    resRR.className = "font-semibold text-gray-400";
                }
            } else {
                resRR.textContent = "1 : 0.00";
                resRR.className = "font-semibold text-gray-400";
            }
        }

        // Añadir el listener para que se actualice al escribir
        inputs.forEach(input => {
            input.addEventListener('input', calculate);
        });

        // Calcular estado inicial
        calculate();
    </script>
</body>
</html>
